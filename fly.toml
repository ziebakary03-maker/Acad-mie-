app = "academie-dropshipping"   # à changer : nom unique
primary_region = "cdg"
[build]
[env]
  PORT = "3000"
  DATA_DIR = "/data"
[mounts]
  source = "data"
  destination = "/data"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
