# fly.toml app configuration file generated for academie-drop on 2026-11-20T05:53:41Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'academie-drop'
primary_region = 'ams'

[build]
[env]
  DATA_DIR = '/data'
  PORT = '3000'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
