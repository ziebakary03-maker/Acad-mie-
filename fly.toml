# fly.toml app configuration file generated for dropship-academie on 2026-11-20T06:19:58Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'dropship-academie'
primary_region = 'cdg'

[build]
[env]
  DATA_DIR = '/data'
  PORT = '3000'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
